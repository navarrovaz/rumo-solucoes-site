name: Publicar site

# Publica o site no GitHub Pages sem baixar o submódulo privado rumo-cowork/.
# Requer, nas configurações do repositório, Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Montar a pasta publicada
        run: |
          mkdir _site
          cp -r index.html .nojekyll design-system _site/
          [ -d assets ] && cp -r assets _site/ || true
          [ -d servicos ] && cp -r servicos _site/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
